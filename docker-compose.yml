services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend_inside_container
    environment:
      - BACKEND_URL=http://backend:8000
      - PUBLIC_BACKEND_URL=http://localhost:8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-container
    restart: always
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - /app/.venv
      - media_data:/app/media
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-app_user}
      - DB_PASSWORD=${DB_USER_PASSWORD:-app_password}
      - DB_NAME=${DB_NAME:-app_db}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-app_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-app_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8.2
    container_name: redis-container
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  adminer:
    image: adminer:5
    container_name: adminer-container
    restart: always
    ports:
      - '8080:8080'
      
  vault:
    image: hashicorp/vault:2.2.2
    restart: unless-stopped
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/config.hcl"]
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:18201:18200"
    environment:
      VAULT_ADDR: http://127.0.0.1:18200
    volumes:
      - vault_data:/vault/data
      - ./vault/config:/vault/config:ro

volumes:
  redis_data:
    driver: local
  mysql_data:
  media_data:
  vault_data:
    driver: local