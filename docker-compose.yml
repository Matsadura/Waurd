services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend_inside_container
      - /frontend_inside_container/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-container
    restart: always
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-app_user}
      - DB_PASSWORD=${DB_USER_PASSWORD:-app_password}
      - DB_NAME=${DB_NAME:-app_db}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:latest
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-app_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-app_password}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:latest
    container_name: redis-container
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    mem_limit: 1g
    networks:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=512
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    mem_limit: 1g
    networks:
      - elastic

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.2.0
    container_name: filebeat
    user: root
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - elasticsearch
    networks:
      - elastic

volumes:
  redis_data:
    driver: local
  mysql_data:
  es_data:
  filebeat_data:
networks:
  elastic:
    driver: bridge
