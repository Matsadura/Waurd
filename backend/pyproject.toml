[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matsadura", email = "zidanditoo1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncmy>=0.2.16",
    "cryptography>=43.0.0",
    "fastapi[standard]>=0.142.2",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.35",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
